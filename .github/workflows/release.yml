name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: plasto-api:${{ github.ref_name }}
      # Push to GCP Artifact Registry / Azure ACR once registry secrets are configured:
      # - uses: docker/login-action@v3
      #   with:
      #     registry: REGION-docker.pkg.dev
      #     username: _json_key
      #     password: ${{ secrets.GCP_SA_KEY }}

  mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile deps
        working-directory: mobile
        run: npm ci
      - name: Build debug APK (scaffold)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plasto-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
